[project]
name = "dash"
version = "0.1.0"
description = "Dash – server, TUI, and CLI in one entry point"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "textual>=1.0",
    "httpx>=0.28",
    "websockets>=14.0",
]

[tool.setuptools]
py-modules = ["dash", "client"]

[project.scripts]
dash = "dash:main"
