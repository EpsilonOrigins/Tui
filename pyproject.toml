[project]
name = "tui-websocket-example"
version = "0.1.0"
description = "Example app: Textual TUI client that posts to a FastAPI server and receives WebSocket updates"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "textual>=1.0",
    "httpx>=0.28",
    "websockets>=14.0",
]

[project.scripts]
start-server = "server:main"
start-tui = "client:main"
